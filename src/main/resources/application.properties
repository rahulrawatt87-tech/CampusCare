# =====================================================================
# CampusCare Application Configuration
# =====================================================================

# Database Configuration
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/campuscare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
db.user=root
db.password=root

# Server Configuration
server.port=8080
server.contextPath=/CampusCare

# Administrator Registration Verification Key (Required to verify authentic admin registration)
admin.registration.secretKey=CAMPUS-ADMIN-2026

# Complaint Escalation / Overdue Thresholds (in hours)
escalation.overdue.urgent.hours=24
escalation.overdue.high.hours=48
escalation.overdue.medium.hours=72
escalation.overdue.low.hours=120

# Upload Configuration
upload.maxFileSize=10485760
upload.allowedExtensions=jpg,jpeg,png,gif,pdf
upload.allowedMimeTypes=image/jpeg,image/png,image/gif,application/pdf
upload.dir=uploads
